name: Behaviour change or new feature
description: Propose a change to how the skill works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong or is missing today, in a real project. A transcript excerpt helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you propose
      description: Why does this belong in the skill and not in your project's CLAUDE.md? whole-team stays small.
    validations:
      required: true
  - type: textarea
    id: eval
    attributes:
      label: How to test it
      description: An eval case (prompt and what should pass) that fails today and passes after the change.
