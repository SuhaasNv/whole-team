name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Validate skill, plugin and docs
        run: python tools/validate.py
      - name: Unit tests for wt.py
        run: python -m unittest discover -s plugins/whole-team/skills/whole-team/scripts -v
