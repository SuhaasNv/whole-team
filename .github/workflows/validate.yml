name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Validate skill, plugin and docs
        run: python tools/validate.py
      - name: Unit tests for wt.py
        run: python -m unittest discover -s plugins/whole-team/skills/whole-team/scripts -v
